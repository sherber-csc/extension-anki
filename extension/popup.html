<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Queue</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        width: 360px;
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.4;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }

      h1,
      h2 {
        margin: 0;
      }

      h1 {
        font-size: 16px;
      }

      h2 {
        font-size: 14px;
        margin-bottom: 8px;
      }

      button {
        padding: 4px 8px;
        font-size: 12px;
      }

      #status {
        margin-bottom: 8px;
        color: #555;
      }

      #pending-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .queue-item {
        border: 1px solid #ddd;
        padding: 8px;
      }

      .queue-item strong {
        display: block;
        margin-bottom: 4px;
      }

      .empty {
        color: #666;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Queue</h1>
      <div>
        <button id="generate-button" type="button">Generate pending cards</button>
        <button id="refresh-button" type="button">Refresh</button>
      </div>
    </header>
    <div id="status">Loading...</div>
    <div id="action-message"></div>
    <section>
      <h2>Pending</h2>
      <div id="pending-list"></div>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
